name: Publish to the Viam registry

on:
  push:
    # Accept both "v0.2.0" and "0.2.0" style tags.
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to publish (e.g. 0.2.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"
      - name: Build module tarball
        run: make module
      - name: Upload to registry
        uses: viamrobotics/upload-module@v1
        with:
          module-path: module.tar.gz
          platform: any
          version: ${{ steps.version.outputs.version }}
          key-id: ${{ secrets.VIAM_DEV_API_KEY_ID }}
          key-value: ${{ secrets.VIAM_DEV_API_KEY }}
